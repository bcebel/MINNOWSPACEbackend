<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Minnow Video Strike</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 20px;
            max-width: 1200px;
            margin: 0 auto;
        }

        #videoGallery {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
            gap: 20px;
        }

        .video-card {
            border: 1px solid #ccc;
            padding: 15px;
            border-radius: 8px;
        }

        video {
            width: 100%;
            max-height: 500px;
            background-color: #f0f0f0;
        }

        #errorLog {
            background-color: #f8d7da;
            color: #721c24;
            padding: 10px;
            margin-top: 10px;
            border-radius: 5px;
            display: none;
        }
    </style>
</head>

<body>
    <h1>Minnow Video Strike</h1>
    <div id="videoGallery"></div>
    <div id="errorLog"></div>

    <script src="https://cdn.jsdelivr.net/npm/webtorrent@latest/webtorrent.min.js"></script>
    <script>
        // WebTorrent always
        const client = new WebTorrent();
        const activeTorrents = new Map(); // magnetLink -> { torrent, blobUrl }
        const pinataCache = new Map(); // cid -> url

        function logError(message, details = null) {
            const errorLog = document.getElementById('errorLog');
            errorLog.style.display = 'block';
            errorLog.innerHTML = `<strong>Error:</strong> ${message}`;
            if (details) console.error('Details:', details);
        }

        async function fetchVideos() {
            try {
                console.log("Fetching /api/videos...");
                const response = await fetch("https://minnowspacebackend-e6635e46c3d0.herokuapp.com/api/videos");
                if (!response.ok) throw new Error(`HTTP ${response.status}`);
                const videos = await response.json();
                console.log("Fetched:", videos);
                return videos;
            } catch (error) {
                logError("Fetch failed", error);
                return [];
            }
        }

        function setupTorrent(video, videoElement, sourceSpan) {
            if (!video.magnetLink) {
                console.log(`No magnetLink for ${video.title}`);
                if (video.cid) usePinata(video, videoElement, sourceSpan);
                return;
            }

            if (activeTorrents.has(video.magnetLink)) {
                const { torrent, blobUrl } = activeTorrents.get(video.magnetLink);
                console.log(`Torrent cached: ${video.title} - ${torrent.numPeers} peers`);
                if (blobUrl && torrent.numPeers > 0) {
                    videoElement.src = blobUrl;
                    sourceSpan.textContent = `Torrent (${torrent.numPeers} peers)`;
                } else if (video.cid) {
                    usePinata(video, videoElement, sourceSpan);
                }
                return;
            }

            const torrent = client.add(video.magnetLink, { announce: ['wss://tracker.btorrent.xyz'] });
            activeTorrents.set(video.magnetLink, { torrent, blobUrl: null });
            console.log(`Torrent added: ${video.title} - ${video.magnetLink}`);

            torrent.on('error', err => {
                logError(`Torrent error: ${video.title}`, err);
                if (video.cid) usePinata(video, videoElement, sourceSpan);
            });
            torrent.on('metadata', () => updateTorrent(torrent, video, videoElement, sourceSpan));
            torrent.on('peer', () => updateTorrent(torrent, video, videoElement, sourceSpan));
        }

        function updateTorrent(torrent, video, videoElement, sourceSpan) {
            console.log(`Torrent check: ${video.title} - ${torrent.numPeers} peers`);
            if (torrent.numPeers > 0) {
                const file = torrent.files.find(f => f.name.endsWith(".mp4"));
                if (file) {
                    file.getBlob((err, blob) => {
                        if (!err) {
                            const blobUrl = URL.createObjectURL(blob);
                            activeTorrents.set(video.magnetLink, { torrent, blobUrl });
                            videoElement.src = blobUrl;
                            sourceSpan.textContent = `Torrent (${torrent.numPeers} peers)`;
                            console.log(`Torrent loaded: ${video.title} - ${blob.size} bytes`);
                        } else {
                            logError(`Blob fail: ${video.title}`, err);
                            if (video.cid) usePinata(video, videoElement, sourceSpan);
                        }
                    });
                } else if (video.cid) {
                    usePinata(video, videoElement, sourceSpan);
                }
            } else if (video.cid) {
                usePinata(video, videoElement, sourceSpan);
            }
        }

        function usePinata(video, videoElement, sourceSpan) {
            if (pinataCache.has(video.cid)) {
                videoElement.src = pinataCache.get(video.cid);
                sourceSpan.textContent = "Pinata";
                console.log(`Pinata cached: ${video.title} - ${video.cid}`);
            } else {
                const pinataUrl = `https://gateway.pinata.cloud/ipfs/${video.cid}`;
                videoElement.src = pinataUrl;
                pinataCache.set(video.cid, pinataUrl);
                sourceSpan.textContent = "Pinata";
                console.log(`Pinata loaded: ${video.title} - ${video.cid}`);
            }
        }

        async function renderVideos() {
            const videos = await fetchVideos();
            const gallery = document.getElementById("videoGallery");
            gallery.innerHTML = "";
            if (!videos || !videos.length) {
                logError("No videos found");
                return;
            }
            console.log("Rendering:", videos.length);

            videos.forEach((video, index) => {
                const card = document.createElement("div");
                card.className = "video-card";
                const videoElement = document.createElement("video");
                videoElement.controls = true;

                const sourceId = `source-${index}`;
                card.innerHTML = `
                    <h3>${video.title || "Untitled"}</h3>
                    <p>${video.description || "No desc"}</p>
                    <p>Source: <span id="${sourceId}">Loading...</span></p>
                `;
                gallery.appendChild(card);

                const sourceSpan = document.getElementById(sourceId);
                console.log(`Card added: ${video.title}, ID: ${sourceId}`);

                card.appendChild(videoElement);

                // WebTorrent always, Pinata via CID
                setupTorrent(video, videoElement, sourceSpan);
            });
        }

        document.addEventListener("DOMContentLoaded", () => {
            console.log("Page loaded, rendering with WebTorrent always...");
            renderVideos();
            setInterval(renderVideos, 60000); // 60s refresh
        });
    </script>
</body>

</html>
